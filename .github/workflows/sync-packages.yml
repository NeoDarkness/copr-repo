name: Sync Package Versions

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-packages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rust2rpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rust2rpm || true

      - name: Run Sync Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, creating commit..."
            git add .
            git commit -m "chore(sync): auto-update package versions and spec files [skip ci]"
            
            git pull --rebase origin main
            git push
          else
            echo "No package updates found. Repository is up to date."
          fi